version: 2.1

orbs:
  go: circleci/go@2.1.0

jobs:
  lint:
    docker:
      - image: cimg/go:1.25
    resource_class: medium
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - run:
          name: install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin" v2.11.3
      - run:
          name: golangci-lint
          command: golangci-lint run --timeout 5m ./...

  test:
    docker:
      - image: cimg/go:1.25
    resource_class: medium
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - run:
          name: vet
          command: go vet ./...
      - run:
          name: test
          command: go test -race -coverprofile=coverage.out ./...
      - store_artifacts:
          path: coverage.out
          destination: coverage.out

  docker-build:
    docker:
      - image: cimg/go:1.25
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: docker build
          command: docker build -t genie-api:${CIRCLE_SHA1:0:7} .

workflows:
  ci:
    jobs:
      - lint
      - test
      - docker-build:
          requires:
            - lint
            - test
          filters:
            branches:
              only:
                - main
